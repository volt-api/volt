<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b2e"/>
      <stop offset="100%" stop-color="#151621"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Window -->
  <rect width="720" height="470" rx="12" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect width="720" height="40" rx="12" fill="#282a3a"/>
  <rect y="30" width="720" height="10" fill="#282a3a"/>
  <circle cx="22" cy="20" r="7" fill="#ff5f57"/>
  <circle cx="44" cy="20" r="7" fill="#febc2e"/>
  <circle cx="66" cy="20" r="7" fill="#28c840"/>
  <text x="360" y="25" text-anchor="middle" fill="#8b8fa3" font-family="'SF Mono',Consolas,monospace" font-size="13">api/create-user.volt</text>

  <!-- Line gutter -->
  <rect x="0" y="40" width="44" height="430" fill="#16172a" rx="0"/>

  <!-- Line numbers -->
  <text x="32" y="72" text-anchor="end" fill="#3b3f5c" font-family="'SF Mono',Consolas,monospace" font-size="12"> 1</text>
  <text x="32" y="94" text-anchor="end" fill="#3b3f5c" font-family="'SF Mono',Consolas,monospace" font-size="12"> 2</text>
  <text x="32" y="116" text-anchor="end" fill="#3b3f5c" font-family="'SF Mono',Consolas,monospace" font-size="12"> 3</text>
  <text x="32" y="138" text-anchor="end" fill="#3b3f5c" font-family="'SF Mono',Consolas,monospace" font-size="12"> 4</text>
  <text x="32" y="160" text-anchor="end" fill="#3b3f5c" font-family="'SF Mono',Consolas,monospace" font-size="12"> 5</text>
  <text x="32" y="182" text-anchor="end" fill="#3b3f5c" font-family="'SF Mono',Consolas,monospace" font-size="12"> 6</text>
  <text x="32" y="204" text-anchor="end" fill="#3b3f5c" font-family="'SF Mono',Consolas,monospace" font-size="12"> 7</text>
  <text x="32" y="226" text-anchor="end" fill="#3b3f5c" font-family="'SF Mono',Consolas,monospace" font-size="12"> 8</text>
  <text x="32" y="248" text-anchor="end" fill="#3b3f5c" font-family="'SF Mono',Consolas,monospace" font-size="12"> 9</text>
  <text x="32" y="270" text-anchor="end" fill="#3b3f5c" font-family="'SF Mono',Consolas,monospace" font-size="12">10</text>
  <text x="32" y="292" text-anchor="end" fill="#3b3f5c" font-family="'SF Mono',Consolas,monospace" font-size="12">11</text>
  <text x="32" y="314" text-anchor="end" fill="#3b3f5c" font-family="'SF Mono',Consolas,monospace" font-size="12">12</text>
  <text x="32" y="336" text-anchor="end" fill="#3b3f5c" font-family="'SF Mono',Consolas,monospace" font-size="12">13</text>
  <text x="32" y="358" text-anchor="end" fill="#3b3f5c" font-family="'SF Mono',Consolas,monospace" font-size="12">14</text>
  <text x="32" y="380" text-anchor="end" fill="#3b3f5c" font-family="'SF Mono',Consolas,monospace" font-size="12">15</text>
  <text x="32" y="402" text-anchor="end" fill="#3b3f5c" font-family="'SF Mono',Consolas,monospace" font-size="12">16</text>
  <text x="32" y="424" text-anchor="end" fill="#3b3f5c" font-family="'SF Mono',Consolas,monospace" font-size="12">17</text>
  <text x="32" y="446" text-anchor="end" fill="#3b3f5c" font-family="'SF Mono',Consolas,monospace" font-size="12">18</text>

  <!-- Content -->
  <text x="54" y="72" fill="#565f89" font-family="'SF Mono',Consolas,monospace" font-size="14" font-style="italic"># Create a new user account</text>
  <text x="54" y="94" fill="#f7768e" font-family="'SF Mono',Consolas,monospace" font-size="14">name:</text>
  <text x="105" y="94" fill="#c0caf5" font-family="'SF Mono',Consolas,monospace" font-size="14"> Create User</text>
  <text x="54" y="116" fill="#f7768e" font-family="'SF Mono',Consolas,monospace" font-size="14">method:</text>
  <text x="122" y="116" fill="#7dcfff" font-family="'SF Mono',Consolas,monospace" font-size="14" font-weight="bold"> POST</text>
  <text x="54" y="138" fill="#f7768e" font-family="'SF Mono',Consolas,monospace" font-size="14">url:</text>
  <text x="88" y="138" fill="#73daca" font-family="'SF Mono',Consolas,monospace" font-size="14"> https://{{host}}/api/v1/users</text>
  <text x="54" y="160" fill="#f7768e" font-family="'SF Mono',Consolas,monospace" font-size="14">timeout:</text>
  <text x="130" y="160" fill="#ff9e64" font-family="'SF Mono',Consolas,monospace" font-size="14"> 5000</text>
  <text x="54" y="182" fill="#f7768e" font-family="'SF Mono',Consolas,monospace" font-size="14">headers:</text>
  <text x="54" y="204" fill="#565f89" font-family="'SF Mono',Consolas,monospace" font-size="14">  -</text>
  <text x="82" y="204" fill="#bb9af7" font-family="'SF Mono',Consolas,monospace" font-size="14"> Content-Type: application/json</text>
  <text x="54" y="226" fill="#565f89" font-family="'SF Mono',Consolas,monospace" font-size="14">  -</text>
  <text x="82" y="226" fill="#bb9af7" font-family="'SF Mono',Consolas,monospace" font-size="14"> Authorization: Bearer {{$api_key}}</text>
  <text x="54" y="248" fill="#f7768e" font-family="'SF Mono',Consolas,monospace" font-size="14">body:</text>
  <text x="54" y="270" fill="#c0caf5" font-family="'SF Mono',Consolas,monospace" font-size="14">  {</text>
  <text x="54" y="292" fill="#7dcfff" font-family="'SF Mono',Consolas,monospace" font-size="14">    "name"</text>
  <text x="126" y="292" fill="#89ddff" font-family="'SF Mono',Consolas,monospace" font-size="14">:</text>
  <text x="140" y="292" fill="#9ece6a" font-family="'SF Mono',Consolas,monospace" font-size="14">"{{username}}"</text>
  <text x="264" y="292" fill="#565f89" font-family="'SF Mono',Consolas,monospace" font-size="14">,</text>
  <text x="54" y="314" fill="#7dcfff" font-family="'SF Mono',Consolas,monospace" font-size="14">    "email"</text>
  <text x="134" y="314" fill="#89ddff" font-family="'SF Mono',Consolas,monospace" font-size="14">:</text>
  <text x="148" y="314" fill="#9ece6a" font-family="'SF Mono',Consolas,monospace" font-size="14">"{{email}}"</text>
  <text x="248" y="314" fill="#565f89" font-family="'SF Mono',Consolas,monospace" font-size="14">,</text>
  <text x="54" y="336" fill="#7dcfff" font-family="'SF Mono',Consolas,monospace" font-size="14">    "role"</text>
  <text x="126" y="336" fill="#89ddff" font-family="'SF Mono',Consolas,monospace" font-size="14">:</text>
  <text x="140" y="336" fill="#9ece6a" font-family="'SF Mono',Consolas,monospace" font-size="14">"member"</text>
  <text x="54" y="358" fill="#c0caf5" font-family="'SF Mono',Consolas,monospace" font-size="14">  }</text>
  <text x="54" y="380" fill="#f7768e" font-family="'SF Mono',Consolas,monospace" font-size="14">tests:</text>
  <text x="54" y="402" fill="#565f89" font-family="'SF Mono',Consolas,monospace" font-size="14">  -</text>
  <text x="82" y="402" fill="#9ece6a" font-family="'SF Mono',Consolas,monospace" font-size="14"> status equals 201</text>
  <text x="54" y="424" fill="#565f89" font-family="'SF Mono',Consolas,monospace" font-size="14">  -</text>
  <text x="82" y="424" fill="#9ece6a" font-family="'SF Mono',Consolas,monospace" font-size="14"> $.id exists</text>
  <text x="54" y="446" fill="#565f89" font-family="'SF Mono',Consolas,monospace" font-size="14">  -</text>
  <text x="82" y="446" fill="#9ece6a" font-family="'SF Mono',Consolas,monospace" font-size="14"> $.name equals {{username}}</text>
</svg>