<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380">
  <defs>
    <style>
      .bg { fill: #1a1b26; }
      .titlebar { fill: #24283b; }
      .dot-red { fill: #f7768e; }
      .dot-yellow { fill: #e0af68; }
      .dot-green { fill: #9ece6a; }
      .title { fill: #a9b1d6; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 13px; }
      .comment { fill: #565f89; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 14px; font-style: italic; }
      .key { fill: #f7768e; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 14px; }
      .val { fill: #c0caf5; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 14px; }
      .urlval { fill: #73daca; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 14px; }
      .method { fill: #7dcfff; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 14px; font-weight: bold; }
      .dash { fill: #565f89; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 14px; }
      .header { fill: #bb9af7; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 14px; }
      .assert { fill: #9ece6a; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 14px; }
      .linenum { fill: #3b3f52; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 12px; }
    </style>
  </defs>
  <!-- Window -->
  <rect class="bg" width="680" height="380" rx="10"/>
  <rect class="titlebar" width="680" height="38" rx="10"/>
  <rect class="titlebar" y="28" width="680" height="10"/>
  <!-- Traffic lights -->
  <circle class="dot-red" cx="20" cy="19" r="6"/>
  <circle class="dot-yellow" cx="40" cy="19" r="6"/>
  <circle class="dot-green" cx="60" cy="19" r="6"/>
  <text class="title" x="340" y="24" text-anchor="middle">api/create-user.volt</text>
  <!-- Line numbers + content -->
  <text class="linenum" x="15" y="68">1</text>
  <text class="comment" x="45" y="68"># Create a new user</text>

  <text class="linenum" x="15" y="90">2</text>
  <text class="key" x="45" y="90">name:</text><text class="val" x="90" y="90"> Create User</text>

  <text class="linenum" x="15" y="112">3</text>
  <text class="key" x="45" y="112">method:</text><text class="method" x="110" y="112"> POST</text>

  <text class="linenum" x="15" y="134">4</text>
  <text class="key" x="45" y="134">url:</text><text class="urlval" x="80" y="134"> https://{{host}}/api/v1/users</text>

  <text class="linenum" x="15" y="156">5</text>
  <text class="key" x="45" y="156">headers:</text>

  <text class="linenum" x="15" y="178">6</text>
  <text class="dash" x="45" y="178">  -</text><text class="header" x="68" y="178"> Content-Type: application/json</text>

  <text class="linenum" x="15" y="200">7</text>
  <text class="dash" x="45" y="200">  -</text><text class="header" x="68" y="200"> Authorization: Bearer {{$api_key}}</text>

  <text class="linenum" x="15" y="222">8</text>
  <text class="key" x="45" y="222">body:</text>

  <text class="linenum" x="15" y="244">9</text>
  <text class="val" x="45" y="244">  { "name": "{{username}}", "role": "member" }</text>

  <text class="linenum" x="10" y="266">10</text>
  <text class="key" x="45" y="266">tests:</text>

  <text class="linenum" x="10" y="288">11</text>
  <text class="dash" x="45" y="288">  -</text><text class="assert" x="68" y="288"> status equals 201</text>

  <text class="linenum" x="10" y="310">12</text>
  <text class="dash" x="45" y="310">  -</text><text class="assert" x="68" y="310"> $.id exists</text>

  <text class="linenum" x="10" y="332">13</text>
  <text class="dash" x="45" y="332">  -</text><text class="assert" x="68" y="332"> $.name equals {{username}}</text>

  <text class="linenum" x="10" y="354">14</text>
  <text class="dash" x="45" y="354">  -</text><text class="assert" x="68" y="354"> header.location contains /users/</text>
</svg>