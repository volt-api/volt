  <text x="24" y="112" fill="#7aa2f7" font-family="'SF Mono',Consolas,monospace" font-size="11">HTTPie</text>
  <rect x="105" y="101" width="35" height="13" rx="3" fill="#7aa2f7" opacity="0.4"/>
  <text x="148" y="112" fill="#7aa2f7" font-family="'SF Mono',Consolas,monospace" font-size="11">30 MB</text>

  <text x="24" y="128" fill="#bb9af7" font-family="'SF Mono',Consolas,monospace" font-size="11">Bruno</text>
  <rect x="105" y="117" width="175" height="13" rx="3" fill="#bb9af7" opacity="0.35"/>
  <text x="288" y="128" fill="#bb9af7" font-family="'SF Mono',Consolas,monospace" font-size="11">150 MB</text>

  <text x="24" y="144" fill="#e0af68" font-family="'SF Mono',Consolas,monospace" font-size="11">Insomnia</text>
