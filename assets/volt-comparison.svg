<svg xmlns="http://www.w3.org/2000/svg" width="820" height="580" viewBox="0 0 820 580">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b2e"/>
      <stop offset="100%" stop-color="#151621"/>
    </linearGradient>
    <linearGradient id="voltGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9ece6a"/>
      <stop offset="100%" stop-color="#73daca"/>
    </linearGradient>
    <linearGradient id="curlGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#7dcfff"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Window -->
  <rect width="820" height="580" rx="12" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect width="820" height="40" rx="12" fill="#282a3a"/>
  <rect y="30" width="820" height="10" fill="#282a3a"/>
  <circle cx="22" cy="20" r="7" fill="#ff5f57"/>
  <circle cx="44" cy="20" r="7" fill="#febc2e"/>
  <circle cx="66" cy="20" r="7" fill="#28c840"/>
  <text x="410" y="25" text-anchor="middle" fill="#8b8fa3" font-family="'SF Mono',Consolas,monospace" font-size="13">How Volt Compares</text>

  <!-- ═══════ BINARY SIZE ═══════ -->
  <text x="24" y="72" fill="#565f89" font-family="'SF Mono',Consolas,monospace" font-size="12" font-weight="bold">BINARY SIZE</text>

  <text x="24" y="94" fill="#9ece6a" font-family="'SF Mono',Consolas,monospace" font-size="12" font-weight="bold">Volt</text>
