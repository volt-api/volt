<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380">
  <defs>
    <style>
      .bg { fill: #1a1b26; }
      .titlebar { fill: #24283b; }
      .dot-red { fill: #f7768e; }
      .dot-yellow { fill: #e0af68; }
      .dot-green { fill: #9ece6a; }
      .title { fill: #a9b1d6; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 13px; }
      .prompt { fill: #7aa2f7; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 14px; }
      .cmd { fill: #c0caf5; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 14px; }
      .file { fill: #c0caf5; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 14px; font-weight: bold; }
      .pass { fill: #9ece6a; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 14px; }
      .assert { fill: #a9b1d6; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 14px; }
      .summary { fill: #c0caf5; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 14px; font-weight: bold; }
      .meta { fill: #565f89; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 14px; }
      .green { fill: #9ece6a; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 14px; font-weight: bold; }
      .red { fill: #f7768e; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 14px; font-weight: bold; }
    </style>
  </defs>
  <!-- Window -->
  <rect class="bg" width="720" height="380" rx="10"/>
  <rect class="titlebar" width="720" height="38" rx="10"/>
  <rect class="titlebar" y="28" width="720" height="10"/>
  <!-- Traffic lights -->
  <circle class="dot-red" cx="20" cy="19" r="6"/>
  <circle class="dot-yellow" cx="40" cy="19" r="6"/>
  <circle class="dot-green" cx="60" cy="19" r="6"/>
  <text class="title" x="360" y="24" text-anchor="middle">volt test</text>
  <!-- Content -->
  <text class="prompt" x="20" y="70">$</text>
  <text class="cmd" x="36" y="70"> volt test examples/</text>
  <!-- File 1 -->
  <text class="file" x="20" y="105">get-users.volt</text>
  <text class="pass" x="30" y="127">  &#x2713;</text><text class="assert" x="52" y="127"> status equals 200</text>
  <text class="pass" x="30" y="149">  &#x2713;</text><text class="assert" x="52" y="149"> header.content-type contains json</text>
  <!-- File 2 -->
  <text class="file" x="20" y="184">jsonpath-tests.volt</text>
  <text class="pass" x="30" y="206">  &#x2713;</text><text class="assert" x="52" y="206"> status equals 200</text>
  <text class="pass" x="30" y="228">  &#x2713;</text><text class="assert" x="52" y="228"> $.name equals Leanne Graham</text>
  <text class="pass" x="30" y="250">  &#x2713;</text><text class="assert" x="52" y="250"> $.email equals Sincere@april.biz</text>
  <text class="pass" x="30" y="272">  &#x2713;</text><text class="assert" x="52" y="272"> $.address.city equals Gwenborough</text>
  <text class="pass" x="30" y="294">  &#x2713;</text><text class="assert" x="52" y="294"> $.company.name equals Romaguera-Crona</text>
  <!-- Summary -->
  <text class="summary" x="20" y="340">Results:</text>
  <text class="assert" x="95" y="340"> 7 total,</text>
  <text class="green" x="185" y="340"> 7 passed</text><text class="assert" x="265" y="340">,</text>
  <text class="red" x="275" y="340"> 0 failed</text>
  <text class="meta" x="365" y="340"> (243ms)</text>
</svg>