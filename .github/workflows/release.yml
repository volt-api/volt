name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-linux
            os: ubuntu-latest
            artifact: volt-linux-x86_64
          - target: aarch64-linux
            os: ubuntu-latest
            artifact: volt-linux-aarch64
          - target: x86_64-macos
            os: macos-latest
            artifact: volt-macos-x86_64
          - target: aarch64-macos
            os: macos-latest
            artifact: volt-macos-aarch64
          - target: x86_64-windows
            os: windows-latest
            artifact: volt-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: cp zig-out/bin/volt ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: copy zig-out\bin\volt.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          for dir in */; do
            cp "$dir"* ../
          done
          cd ..
          sha256sum volt-linux-x86_64 volt-linux-aarch64 volt-macos-x86_64 volt-macos-aarch64 volt-windows-x86_64.exe > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/volt-linux-x86_64/volt-linux-x86_64
            artifacts/volt-linux-aarch64/volt-linux-aarch64
            artifacts/volt-macos-x86_64/volt-macos-x86_64
            artifacts/volt-macos-aarch64/volt-macos-aarch64
            artifacts/volt-windows-x86_64.exe/volt-windows-x86_64.exe
            checksums.txt

  update-homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Homebrew tap update
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh workflow run update-formula.yml \
            --repo volt-api/homebrew-volt \
            --field version="$VERSION"
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

  update-scoop:
    name: Update Scoop Manifest
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Scoop bucket update
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh workflow run update-manifest.yml \
            --repo volt-api/scoop-volt \
            --field version="$VERSION"
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
